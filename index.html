<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b41428" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sorties Ciné" />
  <meta name="description" content="Prochaines sorties cinéma en France avec la date officielle." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <title>Sorties Ciné France</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card: #1a1a22;
      --card-border: #2a2a36;
      --text: #f4f4f7;
      --muted: #9a9aab;
      --accent: #b41428;
      --accent-soft: #ff4d63;
      --chip: #2a2a36;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
    }
    body {
      padding-bottom: calc(24px + var(--safe-bottom));
    }
    header.app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15,15,18,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: calc(12px + var(--safe-top)) 16px 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--accent);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .brand-mark svg { width: 22px; height: 22px; }
    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .install-hint {
      margin-top: 10px;
      background: linear-gradient(135deg, #241018, #1a1a22);
      border: 1px solid #3a2030;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.8rem;
      color: #e8d0d6;
      line-height: 1.35;
    }
    .install-hint strong { color: #fff; }
    .install-hint.hidden { display: none; }
    .toolbar {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .toolbar::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      border: 1px solid var(--card-border);
      background: var(--chip);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
    }
    main { padding: 8px 14px 0; max-width: 560px; margin: 0 auto; }
    .week {
      margin-top: 22px;
    }
    .week-title {
      position: sticky;
      top: calc(118px + var(--safe-top));
      z-index: 10;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      background: rgba(15,15,18,0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 4px;
      margin: 0 -2px 10px;
    }
    .week-title h2 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .week-title .count {
      color: var(--muted);
      font-size: 0.75rem;
    }
    .film {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .poster {
      width: 92px;
      height: 138px;
      border-radius: 10px;
      object-fit: cover;
      background: #2a2a36;
      display: block;
    }
    .poster-fallback {
      width: 92px;
      height: 138px;
      border-radius: 10px;
      background: linear-gradient(160deg, #2a2a36, #1a1a22);
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 0.7rem;
      text-align: center;
      padding: 8px;
    }
    .film-body { min-width: 0; }
    .film-title {
      margin: 0 0 4px;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      background: #2a1520;
      color: #ff9aaa;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .meta {
      color: var(--muted);
      font-size: 0.75rem;
    }
    .synopsis {
      margin: 0;
      color: #c8c8d4;
      font-size: 0.8rem;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .status {
      text-align: center;
      color: var(--muted);
      padding: 48px 16px;
      font-size: 0.95rem;
    }
    footer {
      text-align: center;
      color: #66667a;
      font-size: 0.7rem;
      padding: 28px 16px 8px;
      line-height: 1.4;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }
    a.more {
      color: var(--accent-soft);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }
    a.cal-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent-soft);
      border: 1px solid #6a2432;
      background: #241018;
      border-radius: 999px;
      padding: 5px 10px;
      line-height: 1.2;
      -webkit-tap-highlight-color: transparent;
    }
    a.cal-btn:active {
      background: #3a1520;
    }
    a.cal-btn svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }
    a.cal-alt {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 2px;
      font-size: 0.68rem;
      font-weight: 500;
    }
    .cal-alts {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 6px;
    }
    .cal-sep { color: #55556a; font-size: 0.68rem; }
    .cal-hint {
      margin: 2px 0 0;
      color: #c9a0a8;
      font-size: 0.68rem;
      line-height: 1.35;
      max-width: 220px;
    }
    .actions-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="4" y="5" width="16" height="14" rx="2" fill="white"/>
          <circle cx="7" cy="9" r="1" fill="#b41428"/>
          <circle cx="7" cy="12" r="1" fill="#b41428"/>
          <circle cx="7" cy="15" r="1" fill="#b41428"/>
          <circle cx="17" cy="9" r="1" fill="#b41428"/>
          <circle cx="17" cy="12" r="1" fill="#b41428"/>
          <circle cx="17" cy="15" r="1" fill="#b41428"/>
          <path d="M10 9.5v5l5-2.5-5-2.5z" fill="#b41428"/>
        </svg>
      </div>
      <div>
        <h1>Sorties Ciné France</h1>
        <p class="subtitle" id="metaLine">Chargement…</p>
      </div>
    </div>
    <div class="install-hint" id="installHint">
      <strong>Sur iPhone :</strong> Safari → bouton Partager → <strong>Sur l’écran d’accueil</strong>.
    </div>
    <div class="toolbar" id="weekNav" aria-label="Semaines"></div>
  </header>
  <main id="app">
    <div class="status">Chargement des sorties…</div>
  </main>
  <footer id="footer"></footer>
  <script>
    const MONTHS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    const DAYS_FR = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];

    function parseISO(d) {
      const [y,m,day] = d.split('-').map(Number);
      return new Date(y, m-1, day);
    }
    function formatLong(d) {
      const dt = parseISO(d);
      return `${DAYS_FR[dt.getDay()]} ${dt.getDate()} ${MONTHS_FR[dt.getMonth()]} ${dt.getFullYear()}`;
    }
    function formatShort(d) {
      const dt = parseISO(d);
      return `${dt.getDate()} ${MONTHS_FR[dt.getMonth()]}`;
    }
    function weekKey(iso) {
      // French cinema weeks start Wednesday
      return iso;
    }
    function weekLabel(iso) {
      return `Sorties du ${formatShort(iso)}`;
    }
    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function isStandalonePwa() {
      return window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
    }

    function absoluteIcsUrl(filmId) {
      // Absolute HTTPS URL for Safari handoff (required by x-safari-https)
      return new URL(`ics/${filmId}.ics`, window.location.href).href;
    }

    function googleCalendarUrl(f) {
      // All-day event: dates=YYYYMMDD/YYYYMMDD (end exclusive)
      const start = f.releaseDate.replace(/-/g, '');
      const endDate = new Date(f.releaseDate + 'T12:00:00');
      endDate.setDate(endDate.getDate() + 1);
      const end = endDate.toISOString().slice(0, 10).replace(/-/g, '');
      const title = `🎬 ${f.title} — sortie ciné`;
      const bits = [];
      if (f.genres && f.genres.length) bits.push(f.genres.join(', '));
      if (f.duration) bits.push(f.duration);
      let details = bits.join(' · ');
      if (f.synopsis) details += (details ? '\n\n' : '') + f.synopsis;
      if (f.allocineUrl) details += (details ? '\n\n' : '') + f.allocineUrl;
      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: title,
        dates: `${start}/${end}`,
        details: details,
        ctz: 'Europe/Paris'
      });
      if (f.allocineUrl) params.set('location', f.allocineUrl);
      return `https://calendar.google.com/calendar/render?${params.toString()}`;
    }

    /**
     * In standalone PWA, target=_blank opens SFSafariViewController which cannot
     * hand .ics to Calendar (blank page). Open real Safari via x-safari-https://
     * (iOS 15/17/18+; not iOS 16). Fallback: navigate to the https .ics URL.
     */
    function openIcsForCalendar(httpsUrl, hintEl) {
      // Normal Safari: navigate directly to .ics → « Ajouter à Calendrier »
      if (!isStandalonePwa()) {
        window.location.href = httpsUrl;
        return;
      }
      // Standalone PWA: target=_blank = SFSafariViewController (blank page, compass greyed).
      // Force real Safari with x-safari-https:// (works iOS 15/17/18+; not iOS 16).
      const safariUrl = 'x-safari-' + httpsUrl;
      const revealHint = () => {
        if (hintEl) {
          hintEl.hidden = false;
          hintEl.textContent = 'Si rien ne s’ouvre : utilisez « Google Agenda » ou « Copier le lien » puis collez-le dans Safari.';
        }
      };
      const onHide = () => {
        if (document.hidden) {
          clearTimeout(fallbackTimer);
          document.removeEventListener('visibilitychange', onHide);
        }
      };
      document.addEventListener('visibilitychange', onHide);
      const fallbackTimer = setTimeout(() => {
        // Scheme ignored / blocked — do NOT open https in-app (blank). Show secondary options.
        document.removeEventListener('visibilitychange', onHide);
        revealHint();
      }, 1000);
      try {
        window.location.href = safariUrl;
      } catch (e) {
        clearTimeout(fallbackTimer);
        document.removeEventListener('visibilitychange', onHide);
        revealHint();
      }
    }

    function bindCalendarButtons(root) {
      root.querySelectorAll('[data-cal-ics]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const url = btn.getAttribute('data-cal-ics');
          if (!url) return;
          const wrap = btn.closest('.actions-col');
          const hint = wrap ? wrap.querySelector('[data-cal-hint]') : null;
          openIcsForCalendar(url, hint);
        });
      });
      root.querySelectorAll('[data-cal-copy]').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.preventDefault();
          const url = btn.getAttribute('data-cal-copy');
          const wrap = btn.closest('.actions-col');
          const hint = wrap ? wrap.querySelector('[data-cal-hint]') : null;
          try {
            await navigator.clipboard.writeText(url);
            btn.textContent = 'Lien copié ✓';
            if (hint) {
              hint.hidden = false;
              hint.textContent = 'Ouvrez Safari, collez le lien dans la barre d’adresse, puis validez → Ajouter à Calendrier.';
            }
            setTimeout(() => { btn.textContent = 'Copier le lien'; }, 2500);
          } catch (err) {
            if (hint) {
              hint.hidden = false;
              hint.textContent = 'Copie impossible. Ouvrez Safari et allez sur : ' + url;
            } else {
              prompt('Copiez ce lien dans Safari :', url);
            }
          }
        });
      });
    }

    function groupByWeek(films) {
      const map = new Map();
      for (const f of films) {
        const k = weekKey(f.releaseDate);
        if (!map.has(k)) map.set(k, []);
        map.get(k).push(f);
      }
      return [...map.entries()].sort((a,b) => a[0].localeCompare(b[0]));
    }

    function filmCard(f) {
      const metaBits = [];
      if (f.duration) metaBits.push(escapeHtml(f.duration));
      if (f.genres && f.genres.length) metaBits.push(escapeHtml(f.genres.slice(0, 2).join(', ')));
      const poster = f.poster
        ? `<img class="poster" src="${escapeHtml(f.poster)}" alt="Affiche de ${escapeHtml(f.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'poster-fallback',textContent:'Pas d’affiche'}))" />`
        : `<div class="poster-fallback">Pas d’affiche</div>`;
      const synopsis = f.synopsis ? `<p class="synopsis">${escapeHtml(f.synopsis)}</p>` : '';
      const more = f.allocineUrl ? `<a class="more" href="${escapeHtml(f.allocineUrl)}" target="_blank" rel="noopener">Voir sur AlloCiné</a>` : '';
      const icsAbs = absoluteIcsUrl(f.id);
      const gcal = googleCalendarUrl(f);
      const calSvg = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3 10h18" stroke="currentColor" stroke-width="2"/><path d="M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
      // href = absolute https .ics for normal Safari; click handler overrides in standalone
      const cal = `<div class="actions-col">
        <a class="cal-btn" href="${escapeHtml(icsAbs)}" data-cal-ics="${escapeHtml(icsAbs)}" type="text/calendar">${calSvg}<span>Ajouter au calendrier</span></a>
        <div class="cal-alts">
          <a class="cal-alt" href="${escapeHtml(gcal)}" target="_blank" rel="noopener">Google Agenda</a>
          <span class="cal-sep">·</span>
          <a class="cal-alt" href="${escapeHtml(icsAbs)}" data-cal-copy="${escapeHtml(icsAbs)}">Copier le lien</a>
        </div>
        <p class="cal-hint" data-cal-hint hidden></p>
      </div>`;
      return `<article class="film" id="film-${escapeHtml(f.id)}">
        ${poster}
        <div class="film-body">
          <h3 class="film-title">${escapeHtml(f.title)}</h3>
          <div class="meta-row">
            <span class="badge">${escapeHtml(formatShort(f.releaseDate))}</span>
            <span class="meta">${metaBits.join(' · ')}</span>
          </div>
          ${synopsis}
          <div class="actions">${cal}${more}</div>
        </div>
      </article>`;
    }

    function render(data, filterWeek) {
      const films = filterWeek
        ? data.films.filter(f => f.releaseDate === filterWeek)
        : data.films;
      const groups = groupByWeek(films);
      const app = document.getElementById('app');
      if (!groups.length) {
        app.innerHTML = `<div class="status">Aucune sortie pour cette semaine.</div>`;
        return;
      }
      app.innerHTML = groups.map(([week, list]) => `
        <section class="week" id="week-${week}">
          <div class="week-title">
            <h2>${escapeHtml(weekLabel(week))}</h2>
            <span class="count">${list.length} film${list.length > 1 ? 's' : ''}</span>
          </div>
          ${list.map(filmCard).join('')}
        </section>
      `).join('');
      bindCalendarButtons(app);
    }

    function renderNav(data, active) {
      const weeks = [...new Set(data.films.map(f => f.releaseDate))].sort();
      const nav = document.getElementById('weekNav');
      const allChip = `<button type="button" class="chip ${!active ? 'active' : ''}" data-week="">Toutes</button>`;
      nav.innerHTML = allChip + weeks.map(w =>
        `<button type="button" class="chip ${active === w ? 'active' : ''}" data-week="${w}">${escapeHtml(formatShort(w))}</button>`
      ).join('');
      nav.onclick = (e) => {
        const btn = e.target.closest('button.chip');
        if (!btn) return;
        const w = btn.dataset.week || null;
        renderNav(data, w);
        render(data, w);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
    }

    function hideInstallIfStandalone() {
      if (isStandalonePwa()) document.getElementById('installHint').classList.add('hidden');
    }

    async function main() {
      hideInstallIfStandalone();
      try {
        const res = await fetch('data.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        document.getElementById('metaLine').textContent =
          `${data.count} films · ${formatShort(data.from)} → ${formatShort(data.to)}`;
        document.getElementById('footer').innerHTML =
          `Données : ${escapeHtml(data.source)} · Màj ${escapeHtml((data.generatedAt || '').slice(0,10))}<br/>Dates de sortie officielle en France (souvent le mercredi).`;
        renderNav(data, null);
        render(data, null);
      } catch (err) {
        document.getElementById('app').innerHTML =
          `<div class="status">Impossible de charger les sorties.<br/><small>${escapeHtml(err.message)}</small></div>`;
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
    main();
  </script>
</body>
</html>
