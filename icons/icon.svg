<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5a7a"/>
      <stop offset="45%" stop-color="#c4183a"/>
      <stop offset="100%" stop-color="#5b1a8a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <!-- rounded app tile -->
  <rect x="28" y="28" width="456" height="456" rx="110" fill="url(#bg)"/>
  <rect x="28" y="28" width="456" height="456" rx="110" fill="url(#glass)"/>
  <rect x="36" y="36" width="440" height="440" rx="102" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- soft highlight blob -->
  <ellipse cx="180" cy="140" rx="140" ry="70" fill="#fff" opacity="0.22" filter="url(#soft)"/>
  <!-- clapper / ticket glass plate -->
  <g transform="translate(96 150)">
    <rect x="0" y="40" width="320" height="200" rx="36" fill="#ffffff" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
    <rect x="0" y="0" width="320" height="56" rx="28" fill="#ffffff" fill-opacity="0.32" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5"/>
    <!-- clapper teeth -->
    <path d="M28 8 L70 48 L112 8 L154 48 L196 8 L238 48 L280 8" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- play diamond -->
    <path d="M140 118 L140 188 L205 153 Z" fill="#ffffff" fill-opacity="0.9"/>
  </g>
</svg>
