name: Mettre à jour les sorties

on:
  schedule:
    # Tous les jours vers 05:17 UTC
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch AlloCiné data
        run: python3 scripts/fetch_allocine.py

      - name: Commit data.json et ics/ si changés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json ics
          if git diff --staged --quiet; then
            echo "Pas de changement"
          else
            git commit -m "chore: mise à jour sorties AlloCiné (data + ics)"
            git push
          fi
