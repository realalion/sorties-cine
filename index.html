<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0a14" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#1a0a14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sorties Ciné" />
  <meta name="description" content="Prochaines sorties cinéma en France avec la date officielle." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <title>Sorties Ciné France</title>
  <style>
    :root {
      --text: #f7f7fb;
      --text-secondary: rgba(247,247,251,0.72);
      --muted: rgba(247,247,251,0.55);
      --accent: #ff4d6d;
      --accent-soft: #ff8fa3;
      --glass: rgba(255,255,255,0.10);
      --glass-strong: rgba(255,255,255,0.16);
      --glass-border: rgba(255,255,255,0.28);
      --glass-border-soft: rgba(255,255,255,0.14);
      --shadow: 0 10px 40px rgba(0,0,0,0.35);
      --radius-lg: 26px;
      --radius-md: 22px;
      --radius-sm: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --header-h: 76px;
      --dock-h: 64px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #0a0610;
    }
    body {
      padding-top: calc(var(--header-h) + var(--safe-top) + 8px);
      padding-bottom: calc(var(--dock-h) + var(--safe-bottom) + 28px);
      overflow-x: hidden;
    }

    /* Ambient Liquid Glass backdrop */
    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: #0a0610;
    }
    .ambient-mesh {
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(ellipse 60% 50% at 15% 20%, rgba(255,80,120,0.55), transparent 55%),
        radial-gradient(ellipse 50% 45% at 85% 15%, rgba(120,60,255,0.45), transparent 50%),
        radial-gradient(ellipse 55% 50% at 70% 80%, rgba(40,140,255,0.35), transparent 55%),
        radial-gradient(ellipse 40% 40% at 20% 85%, rgba(255,140,60,0.28), transparent 50%),
        linear-gradient(160deg, #1a0a18 0%, #0a0610 50%, #12081f 100%);
      filter: blur(8px);
      -webkit-filter: blur(8px);
      transform: scale(1.05);
      animation: meshDrift 22s var(--ease) infinite alternate;
    }
    .ambient-poster {
      position: absolute;
      inset: -10%;
      background-size: cover;
      background-position: center top;
      opacity: 0.38;
      filter: blur(42px) saturate(1.35);
      -webkit-filter: blur(42px) saturate(1.35);
      transform: scale(1.15);
      transition: opacity 0.8s var(--ease), background-image 0.8s var(--ease);
    }
    .ambient-vignette {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(8,4,12,0.25) 0%, rgba(8,4,12,0.55) 45%, rgba(8,4,12,0.82) 100%);
    }
    @keyframes meshDrift {
      from { transform: scale(1.05) translate(0, 0); }
      to { transform: scale(1.1) translate(-2%, 2%); }
    }

    .glass {
      background: var(--glass);
      background-image: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.05) 40%, rgba(255,255,255,0.02) 100%);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      box-shadow:
        var(--shadow),
        inset 0 1px 0 rgba(255,255,255,0.35),
        inset 0 -1px 0 rgba(255,255,255,0.05);
      /* gradient rim via background-clip trick on pseudo */
      position: relative;
    }
    .glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(160deg, rgba(255,255,255,0.55), rgba(255,255,255,0.08) 40%, rgba(255,255,255,0.22));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    header.app-header {
      position: fixed;
      top: calc(10px + var(--safe-top));
      left: 12px;
      right: 12px;
      z-index: 40;
      padding: 12px 14px;
      border-radius: var(--radius-lg);
      max-width: 560px;
      margin: 0 auto;
      width: auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .brand-mark img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    h1 {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .subtitle {
      margin: 2px 0 0;
      color: var(--text-secondary);
      font-size: 0.76rem;
      font-weight: 500;
    }
    .install-hint {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.35;
    }
    .install-hint strong { color: #fff; }
    .install-hint.hidden { display: none; }

    /* Floating bottom week dock */
    .week-dock {
      position: fixed;
      bottom: calc(10px + var(--safe-bottom));
      left: 12px;
      right: 12px;
      z-index: 40;
      padding: 8px;
      border-radius: 999px;
      max-width: 560px;
      margin: 0 auto;
      width: auto;
    }
    .toolbar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 2px;
    }
    .toolbar::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      white-space: nowrap;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      transition: background 0.25s var(--ease), transform 0.2s var(--ease), border-color 0.25s var(--ease);
    }
    .chip:active { transform: scale(0.96); }
    .chip.active {
      background: linear-gradient(180deg, rgba(255,90,120,0.95), rgba(200,30,70,0.92));
      border-color: rgba(255,255,255,0.35);
      box-shadow: 0 4px 18px rgba(255,60,100,0.35), inset 0 1px 0 rgba(255,255,255,0.35);
      color: #fff;
    }

    main {
      position: relative;
      z-index: 1;
      padding: 8px 14px 0;
      max-width: 560px;
      margin: 0 auto;
    }
    .week { margin-top: 18px; }
    .week-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 6px 12px;
    }
    .week-title h2 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .week-title .count {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 500;
    }

    .film {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 12px;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: var(--radius-md);
      animation: cardIn 0.55s var(--ease) both;
    }
    .film:nth-child(2) { animation-delay: 0.03s; }
    .film:nth-child(3) { animation-delay: 0.06s; }
    .film:nth-child(4) { animation-delay: 0.09s; }
    .film:nth-child(5) { animation-delay: 0.12s; }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }

    .poster {
      width: 92px;
      height: 138px;
      border-radius: 14px;
      object-fit: cover;
      background: rgba(255,255,255,0.08);
      display: block;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    .poster-fallback {
      width: 92px;
      height: 138px;
      border-radius: 14px;
      background: linear-gradient(160deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 0.7rem;
      text-align: center;
      padding: 8px;
    }
    .film-body { min-width: 0; }
    .film-title {
      margin: 0 0 6px;
      font-size: 1.02rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      background: rgba(255,77,109,0.22);
      color: #ffb3c1;
      border: 1px solid rgba(255,140,160,0.3);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 0.7rem;
      font-weight: 650;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .meta {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 500;
    }
    .synopsis {
      margin: 0;
      color: var(--text-secondary);
      font-size: 0.8rem;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .status {
      text-align: center;
      color: var(--muted);
      padding: 64px 16px;
      font-size: 0.95rem;
      position: relative;
      z-index: 1;
    }
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      color: rgba(247,247,251,0.4);
      font-size: 0.7rem;
      padding: 28px 16px 8px;
      line-height: 1.45;
      max-width: 560px;
      margin: 0 auto;
    }
    #appVersion {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(247,247,251,0.55);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }
    a.more {
      color: var(--accent-soft);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 650;
      display: inline-block;
    }
    button.cal-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 650;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.28);
      background: linear-gradient(180deg, rgba(255,90,120,0.55), rgba(180,30,70,0.45));
      backdrop-filter: blur(12px) saturate(160%);
      -webkit-backdrop-filter: blur(12px) saturate(160%);
      border-radius: 999px;
      padding: 7px 12px;
      line-height: 1.2;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
      appearance: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 4px 14px rgba(255,60,100,0.2);
      transition: transform 0.2s var(--ease);
    }
    button.cal-btn:active { transform: scale(0.97); }
    button.cal-btn svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }
    a.cal-alt, button.cal-alt {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 2px;
      font-size: 0.68rem;
      font-weight: 500;
      font-family: inherit;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }
    .cal-alts {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 6px;
    }
    .cal-sep { color: rgba(255,255,255,0.28); font-size: 0.68rem; }
    .cal-hint {
      margin: 2px 0 0;
      color: #ffc2ce;
      font-size: 0.68rem;
      line-height: 1.35;
      max-width: 220px;
    }
    .actions-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient-mesh"></div>
    <div class="ambient-poster" id="ambientPoster"></div>
    <div class="ambient-vignette"></div>
  </div>

  <header class="app-header glass">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <img src="icons/icon-180.png" alt="" width="44" height="44" />
      </div>
      <div>
        <h1>Sorties Ciné France</h1>
        <p class="subtitle" id="metaLine">Chargement…</p>
      </div>
    </div>
    <div class="install-hint" id="installHint">
      <strong>Sur iPhone :</strong> Safari → bouton Partager → <strong>Sur l’écran d’accueil</strong>.
    </div>
  </header>

  <main id="app">
    <div class="status">Chargement des sorties…</div>
  </main>
  <footer id="footer"></footer>

  <nav class="week-dock glass" aria-label="Filtrer par semaine">
    <div class="toolbar" id="weekNav"></div>
  </nav>

  <script>
    const APP_VERSION = 'v7';
    const MONTHS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    const DAYS_FR = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];

    function parseISO(d) {
      const [y,m,day] = d.split('-').map(Number);
      return new Date(y, m-1, day);
    }
    function formatLong(d) {
      const dt = parseISO(d);
      return `${DAYS_FR[dt.getDay()]} ${dt.getDate()} ${MONTHS_FR[dt.getMonth()]} ${dt.getFullYear()}`;
    }
    function formatShort(d) {
      const dt = parseISO(d);
      return `${dt.getDate()} ${MONTHS_FR[dt.getMonth()]}`;
    }
    function weekKey(iso) { return iso; }
    function weekLabel(iso) { return `Sorties du ${formatShort(iso)}`; }
    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function isStandalonePwa() {
      return window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
    }

    function absoluteIcsUrl(filmId) {
      const base = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/');
      return new URL(`ics/${filmId}.ics`, base).href;
    }

    function googleCalendarUrl(f) {
      const start = f.releaseDate.replace(/-/g, '');
      const endDate = new Date(f.releaseDate + 'T12:00:00');
      endDate.setDate(endDate.getDate() + 1);
      const end = endDate.toISOString().slice(0, 10).replace(/-/g, '');
      const title = `🎬 ${f.title} — sortie ciné`;
      const bits = [];
      if (f.genres && f.genres.length) bits.push(f.genres.join(', '));
      if (f.duration) bits.push(f.duration);
      let details = bits.join(' · ');
      if (f.synopsis) details += (details ? '\n\n' : '') + f.synopsis;
      if (f.allocineUrl) details += (details ? '\n\n' : '') + f.allocineUrl;
      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: title,
        dates: `${start}/${end}`,
        details: details,
        ctz: 'Europe/Paris'
      });
      if (f.allocineUrl) params.set('location', f.allocineUrl);
      return `https://calendar.google.com/calendar/render?${params.toString()}`;
    }

    function openIcsForCalendar(httpsUrl, hintEl) {
      if (!isStandalonePwa()) {
        window.location.href = httpsUrl;
        return;
      }
      const safariUrl = httpsUrl.replace(/^https:\/\//i, 'x-safari-https://');
      const revealHint = () => {
        if (hintEl) {
          hintEl.hidden = false;
          hintEl.textContent = 'Si rien ne s’ouvre : utilisez « Google Agenda » ou « Copier le lien » puis collez-le dans Safari.';
        }
      };
      const onHide = () => {
        if (document.hidden) {
          clearTimeout(fallbackTimer);
          document.removeEventListener('visibilitychange', onHide);
        }
      };
      document.addEventListener('visibilitychange', onHide);
      const fallbackTimer = setTimeout(() => {
        document.removeEventListener('visibilitychange', onHide);
        revealHint();
      }, 1000);
      try {
        window.location.href = safariUrl;
      } catch (e) {
        clearTimeout(fallbackTimer);
        document.removeEventListener('visibilitychange', onHide);
        revealHint();
      }
    }

    function bindCalendarButtons(root) {
      root.querySelectorAll('[data-cal-ics]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const url = btn.getAttribute('data-cal-ics');
          if (!url) return;
          const wrap = btn.closest('.actions-col');
          const hint = wrap ? wrap.querySelector('[data-cal-hint]') : null;
          openIcsForCalendar(url, hint);
        });
      });
      root.querySelectorAll('[data-cal-copy]').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.preventDefault();
          const url = btn.getAttribute('data-cal-copy');
          const wrap = btn.closest('.actions-col');
          const hint = wrap ? wrap.querySelector('[data-cal-hint]') : null;
          try {
            await navigator.clipboard.writeText(url);
            btn.textContent = 'Lien copié ✓';
            if (hint) {
              hint.hidden = false;
              hint.textContent = 'Ouvrez Safari, collez le lien dans la barre d’adresse, puis validez → Ajouter à Calendrier.';
            }
            setTimeout(() => { btn.textContent = 'Copier le lien'; }, 2500);
          } catch (err) {
            if (hint) {
              hint.hidden = false;
              hint.textContent = 'Copie impossible. Ouvrez Safari et allez sur : ' + url;
            } else {
              prompt('Copiez ce lien dans Safari :', url);
            }
          }
        });
      });
    }

    function groupByWeek(films) {
      const map = new Map();
      for (const f of films) {
        const k = weekKey(f.releaseDate);
        if (!map.has(k)) map.set(k, []);
        map.get(k).push(f);
      }
      return [...map.entries()].sort((a,b) => a[0].localeCompare(b[0]));
    }

    function setAmbientPoster(url) {
      const el = document.getElementById('ambientPoster');
      if (!el || !url) return;
      el.style.backgroundImage = `url("${url}")`;
    }

    function filmCard(f) {
      const metaBits = [];
      if (f.duration) metaBits.push(escapeHtml(f.duration));
      if (f.genres && f.genres.length) metaBits.push(escapeHtml(f.genres.slice(0, 2).join(', ')));
      const poster = f.poster
        ? `<img class="poster" src="${escapeHtml(f.poster)}" alt="Affiche de ${escapeHtml(f.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'poster-fallback',textContent:'Pas d’affiche'}))" />`
        : `<div class="poster-fallback">Pas d’affiche</div>`;
      const synopsis = f.synopsis ? `<p class="synopsis">${escapeHtml(f.synopsis)}</p>` : '';
      const more = f.allocineUrl ? `<a class="more" href="${escapeHtml(f.allocineUrl)}" target="_blank" rel="noopener">Voir sur AlloCiné</a>` : '';
      const icsAbs = absoluteIcsUrl(f.id);
      const gcal = googleCalendarUrl(f);
      const calSvg = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3 10h18" stroke="currentColor" stroke-width="2"/><path d="M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
      const cal = `<div class="actions-col">
        <button type="button" class="cal-btn" data-cal-ics="${escapeHtml(icsAbs)}">${calSvg}<span>Ajouter au calendrier</span></button>
        <div class="cal-alts">
          <a class="cal-alt" href="${escapeHtml(gcal)}" rel="noopener">Google Agenda</a>
          <span class="cal-sep">·</span>
          <button type="button" class="cal-alt" data-cal-copy="${escapeHtml(icsAbs)}">Copier le lien</button>
        </div>
        <p class="cal-hint" data-cal-hint hidden></p>
      </div>`;
      return `<article class="film glass" id="film-${escapeHtml(f.id)}">
        ${poster}
        <div class="film-body">
          <h3 class="film-title">${escapeHtml(f.title)}</h3>
          <div class="meta-row">
            <span class="badge">${escapeHtml(formatShort(f.releaseDate))}</span>
            <span class="meta">${metaBits.join(' · ')}</span>
          </div>
          ${synopsis}
          <div class="actions">${cal}${more}</div>
        </div>
      </article>`;
    }

    function render(data, filterWeek) {
      const films = filterWeek
        ? data.films.filter(f => f.releaseDate === filterWeek)
        : data.films;
      const groups = groupByWeek(films);
      const app = document.getElementById('app');
      if (!groups.length) {
        app.innerHTML = `<div class="status">Aucune sortie pour cette semaine.</div>`;
        return;
      }
      // Ambient from first visible film with a poster
      const firstPoster = films.find(f => f.poster);
      if (firstPoster) setAmbientPoster(firstPoster.poster);

      app.innerHTML = groups.map(([week, list]) => `
        <section class="week" id="week-${week}">
          <div class="week-title">
            <h2>${escapeHtml(weekLabel(week))}</h2>
            <span class="count">${list.length} film${list.length > 1 ? 's' : ''}</span>
          </div>
          ${list.map(filmCard).join('')}
        </section>
      `).join('');
      bindCalendarButtons(app);
    }

    function renderNav(data, active) {
      const weeks = [...new Set(data.films.map(f => f.releaseDate))].sort();
      const nav = document.getElementById('weekNav');
      const allChip = `<button type="button" class="chip ${!active ? 'active' : ''}" data-week="">Toutes</button>`;
      nav.innerHTML = allChip + weeks.map(w =>
        `<button type="button" class="chip ${active === w ? 'active' : ''}" data-week="${w}">${escapeHtml(formatShort(w))}</button>`
      ).join('');
      nav.onclick = (e) => {
        const btn = e.target.closest('button.chip');
        if (!btn) return;
        const w = btn.dataset.week || null;
        renderNav(data, w);
        render(data, w);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
    }

    function hideInstallIfStandalone() {
      if (isStandalonePwa()) document.getElementById('installHint').classList.add('hidden');
    }

    async function main() {
      hideInstallIfStandalone();
      try {
        const res = await fetch('data.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        document.getElementById('metaLine').textContent =
          `${data.count} films · ${formatShort(data.from)} → ${formatShort(data.to)}`;
        document.getElementById('footer').innerHTML =
          `Données : ${escapeHtml(data.source)} · Màj ${escapeHtml((data.generatedAt || '').slice(0,10))}<br/>Dates de sortie officielle en France (souvent le mercredi).<br/><span id="appVersion">${APP_VERSION}</span>`;
        if (data.films && data.films[0] && data.films[0].poster) {
          setAmbientPoster(data.films[0].poster);
        }
        renderNav(data, null);
        render(data, null);
      } catch (err) {
        document.getElementById('app').innerHTML =
          `<div class="status">Impossible de charger les sorties.<br/><small>${escapeHtml(err.message)}</small></div>`;
      }
    }

    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      async function setupSW() {
        try {
          const reg = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
          const poke = () => { try { reg.update(); } catch (e) {} };
          poke();
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') poke();
          });
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                nw.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        } catch (e) {}
      }
      window.addEventListener('load', setupSW);
    }
    main();
  </script>
</body>
</html>
